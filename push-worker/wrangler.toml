# Philip rest-alert Worker (Story 6 §8.2). Free plan: Workers + SQLite-backed Durable Objects.
name = "philip-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# The GitHub Pages origin that may call this Worker (scheme + host, no path, no trailing slash).
ALLOWED_ORIGIN = "https://ryamyamyam.github.io"
# VAPID "sub": a URL or mailto: that identifies the sender to push services.
VAPID_SUBJECT = "https://ryamyamyam.github.io/Philip/"

# Story 11: free Gemini models Philip tries in order (strongest first). Check what your free key can
# call (Settings › Gemini › model list in the app) and edit this list.
GEMINI_MODELS = "gemini-2.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite"

# Secrets (never in this file): npx wrangler secret put VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY
# Story 11: npx wrangler secret put GEMINI_API_KEY / COACH_TOKEN (any random 32+ characters)

[[durable_objects.bindings]]
name = "REST_TIMER"
class_name = "RestTimer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestTimer"]

[[durable_objects.bindings]]
name = "COACH_QUEUE"
class_name = "CoachQueue"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CoachQueue"]
